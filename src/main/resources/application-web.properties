spring.docker.compose.enabled=true
# keep in mind: it cannot be passed via env
spring.docker.compose.file=./src/main/java/org/swetlokognatsk/earking_out/app/web/.docker/compose.dev.yaml
# spring.docker.compose.file=./src/main/java/org/swetlokognatsk/earking_out/app/web/.docker/compose.prod.yaml
spring.docker.compose.stop.command=down

spring.devtools.restart.quiet-period=1500ms
spring.devtools.restart.poll-interval=2000ms

server.forward-headers-strategy=native