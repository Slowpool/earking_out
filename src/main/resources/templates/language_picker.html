<div id="language-picker">
    <button
        th:each="language : ${languages}"
        th:text="${language}"
        th:class="|language-item${selectedLanguage == language ? ' selected' : ''}|"
        hx-trigger="click"
        hx-target="#language-picker"
        th:hx-patch="|/api/v1/language/change/${language}|"
    ></button>
</div>
