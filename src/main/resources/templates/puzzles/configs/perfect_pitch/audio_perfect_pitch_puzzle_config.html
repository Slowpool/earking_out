<!-- TODO hints -->
<div id="audio-perfect-pitch-config-pane">
    <h1 class="centered" th:text="#{puzzles.configs.perfect_pitch.audio.header}"></h1>
    </br>
    <div>
        <div class="puzzle-config-property">
            <label for="audio-perfect-pitch-target-number-of-puzzles" th:text="#{puzzles.configs.number_of_puzzles}"></label>
            &nbsp;
            <input
                id="audio-perfect-pitch-target-number-of-puzzles"
                type="number"
                th:name="${targetNumberOfPuzzlesProp}"
                min="1"
                th:value="${targetNumberOfPuzzles}"
                th:hx-patch="|/api/v1/puzzle/config/perfect-pitch/audio/update/${targetNumberOfPuzzlesProp}|"
                hx-trigger="keyup changed delay:500ms"
                hx-swap="none"
            >
        </div>
        <div class="puzzle-config-property">
            <label for="audio-perfect-pitch-stats-recording" th:text="#{puzzles.configs.stats_recording}"></label>
            <input
                id="audio-perfect-pitch-stats-recording"
                type="checkbox"
                th:name="${statsRecordingProp}"
                th:checked="${statsRecording}"
                th:hx-patch="|/api/v1/puzzle/config/perfect-pitch/audio/update/${statsRecordingProp}|"
                hx-trigger="change"
                hx-swap="none"
            >
            <span class="hint" th:title="#{puzzles.configs.perfect_pitch.stats_recording.hint}">ⓘ</span>
        </div>
        <div class="puzzle-config-piano-keyboard-property">
            <label class="centered" for="piano-keyboard-AUDIO_PERFECT_PITCH_NOTES_PICKER" th:text="#{puzzles.configs.perfect_pitch.audio.notes}"></label>
            <div th:replace="~{piano/piano_keyboard(pianoKeyboardModel=${notesPickerPianoKeyboardModel})}"></div>
        </div>
        <div id="audio-perfect-pitch-root-note" class="puzzle-config-piano-keyboard-property" th:attr="hidden=${inputMode.name() == 'KEYBOARD_AS_PIANO'} ? null : 'hidden'">
            <label for="piano-keyboard-AUDIO_PERFECT_PITCH_ROOT_NOTE_PICKER" th:text="#{puzzles.configs.perfect_pitch.audio.root_note}">
                <!-- TODO hint --></label>
            <div th:replace="~{piano/piano_keyboard(pianoKeyboardModel=${rootNotePickerPianoKeyboardModel})}"></div>
        </div>
        <div class="puzzle-config-property">
            <label id="perfect-pitch-input-mode" th:text="#{puzzles.configs.perfect_pitch.audio.input_mode}"></label>
            &nbsp;
            <select
                id="perfect-pitch-input-mode"
                th:name="${inputModeProp}"
                th:hx-patch="|/api/v1/puzzle/config/perfect-pitch/audio/update/${inputModeProp}|"
                hx-trigger="change"
                hx-swap="none"
            >
                <option
                    th:each="mode : ${inputModes}"
                    th:value="${mode.name()}"
                    th:text="${mode.name()}"
                    th:selected="${inputMode == mode}"
                ></option>
            </select>
            <span class="hint" th:title="#{puzzles.configs.perfect_pitch.input_mode.hint}">ⓘ</span>
        </div>
        <div class="puzzle-config-property">
            <label for="audio-perfect-pitch-guessing-piano-is-soundless" th:text="#{puzzles.configs.perfect_pitch.audio.guessing_piano_is_soundless}"></label>
            &nbsp;
            <input
                id="audio-perfect-pitch-guessing-piano-is-soundless"
                type="checkbox"
                th:name="${guessingPianoIsSoundlessProp}"
                th:checked="${guessingPianoIsSoundless}"
                th:hx-patch="|/api/v1/puzzle/config/perfect-pitch/audio/update/${guessingPianoIsSoundlessProp}|"
                hx-trigger="change"
                hx-swap="none"
            >
            <span class="hint" th:title="#{puzzles.configs.perfect_pitch.guessing_piano_is_soundless.hint}">ⓘ</span>
        </div>
        <div class="centered">
            <button
                class="action-button"
                type="submit"
                hx-trigger="click"
                hx-post="/api/v1/session/perfect-pitch/audio/start"
                hx-target="#main-content"
                th:text="#{exercises.start}"
            ></button>
        </div>
    </div>
</div>
