<div>
    <script nonce="csp_nonce" src="https://unpkg.com/@vkid/sdk@<3.0.0/dist-sdk/umd/index.js"></script>
    <script nonce="csp_nonce" type="text/javascript">
        if ('VKIDSDK' in window) {
            const VKID = window.VKIDSDK;
        
            VKID.Config.init({
                app: 54834142,
                redirectUrl: 'https://earking-out.ru/oauth/vk-id/callback',
                responseMode: VKID.ConfigResponseMode.Callback,
                source: VKID.ConfigSource.LOWCODE,
                scope: 'vkid.profile_info',
            });
        
            const oneTap = new VKID.OneTap();
        
            oneTap.render({
                container: document.currentScript.parentElement,
                fastAuthEnabled: false,
                showAlternativeLogin: true,
                styles: {
                    borderRadius: 4,
                    width: 175,
                    height: 32
                }
            })
                .on(VKID.WidgetEvents.ERROR, vkidOnError)
                .on(VKID.OneTapInternalEvents.LOGIN_SUCCESS, function (payload) {
                    const code = payload.code;
                    const deviceId = payload.device_id;
                
                    VKID.Auth.exchangeCode(code, deviceId)
                        .then(vkidOnCodeSuccess)
                        .catch(vkidOnError);
                });
            
            function vkidOnCodeSuccess(data) {
                VKID.Auth.userInfo(data.access_token)
                    .then(vkidOnUserInfoSuccess)
                    .catch(vkidOnError);
            }

            function vkidOnUserInfoSuccess(response) {
                var userInfo = response.user;
                var neededUserInfo = {
                    userId: userInfo.user_id,
                    avatar: userInfo.avatar,
                    firstName: userInfo.first_name,
                    lastName: userInfo.last_name
                };
                finishVkidOauth(neededUserInfo, function(response) {
                    alert('after sending the user info to db: ' + response);
                    location.reload();
                });
            }
        
            function vkidOnError(error) {
                alert('something went wrong, try again');
            }
        }
    </script>
</div>
