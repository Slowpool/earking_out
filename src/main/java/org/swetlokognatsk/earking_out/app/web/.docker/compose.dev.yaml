services:
  earking-out-web:
    container_name:
      'earking-out-web'
    build:
      dockerfile: './java/Dockerfile'
    volumes:
      - '${PROJECT_ROOT}/target/classes:/app/BOOT-INF/classes:delegated'
      - '${PROJECT_ROOT}/target/lib:/app/BOOT-INF/lib:delegated'
    environment:
      SPRING_APPLICATION_NAME: "${APP_NAME}"
      SPRING_DATASOURCE_URL: "${POSTGRES_CONNECTION_URI}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_DATA_REDIS_HOST: "${SPRING_DATA_REDIS_HOST}"
      SPRING_DATA_REDIS_PORT: "${SPRING_DATA_REDIS_PORT}"
      SPRING_DATA_REDIS_PASSWORD: "${SPRING_DATA_REDIS_PASSWORD}"
      VKID_SERVICE_ID: "${VKID_SERVICE_ID}"
    ports:
      - "1941:8081"
      - '5015:5005'
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_healthy

  postgres:
    image: 'postgres:18.6'
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - 'pg_db:/var/lib/postgresql'
    command: >
      postgres
      -c log_statement=all
      -c log_min_duration_statement=0
      -c log_destination=stderr
    ports:
      - "5433:5432"
  
  redis:
    container_name:
      'earking-out-redis'
    image: 'redis:8.10.2'
    restart: always
    stop_grace_period: 20s
    volumes:
      - './redis/redis.conf:/usr/local/etc/redis/redis.conf'
      - 'redis_data:/data'
    command: >
      redis-server
      /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
  
  kafka:
    container_name:
      'earking-out-kafka'
    image: 'apache/kafka:4.1.2'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
    # TODO what is this
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
    # TODO what is this
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    # TODO what is this
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    # TODO what is this
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    # TODO what is this
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
    # TODO what is this
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    # TODO what is this
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    # TODO what is this
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    # TODO what is this
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - 'kafka_data:/var/lib/kafka/data'
    # TODO explore details
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_db:
  redis_data:
  kafka_data: