services:
  nginx:
    image: nginx:1.31.7
    volumes:
      - './nginx/etc/nginx/ssl:/etc/nginx/ssl:ro'
      - './nginx/etc/nginx/conf.d/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
      - './nginx/etc/nginx/nginx.conf:/etc/nginx/nginx.conf:ro'
    ports:
      - '80:80'
      - '443:443'
      - '1937:5005'
    depends_on:
      - 'earking-out-java'

  earking-out-java:
    container_name:
      'earking-out-java'
    build:
      dockerfile: './java/Dockerfile.prod'
    user: "1000:1000"
    volumes:
    # TODO mount static files, templates, resources.
    # TODO remove these lines
      - '${PROJECT_ROOT}/target/classes:/app/BOOT-INF/classes:delegated'
      - '${PROJECT_ROOT}/target/lib:/app/BOOT-INF/lib:delegated'
    environment:
      SPRING_APPLICATION_NAME: "${APP_NAME}"
      SPRING_DATASOURCE_URL: "${POSTGRES_CONNECTION_URI}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_DATA_REDIS_HOST: "${SPRING_DATA_REDIS_HOST}"
      SPRING_DATA_REDIS_PORT: "${SPRING_DATA_REDIS_PORT}"
      SPRING_DATA_REDIS_PASSWORD: "${SPRING_DATA_REDIS_PASSWORD}"
      VKID_SERVICE_ID: "${VKID_SERVICE_ID}"
    depends_on:
      - postgres
      - redis

  postgres:
    image: 'postgres:18.6'
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - 'pg_db:/var/lib/postgresql'

  redis:
    container_name:
      'earking-out-redis'
    image: 'redis:8.10.2'
    restart: always
    stop_grace_period: 20s
    volumes:
      - './redis/redis.conf:/usr/local/etc/redis/redis.conf'
      - 'redis_data:/data'
    command: >
      redis-server
      /usr/local/etc/redis/redis.conf

volumes:
  pg_db:
  redis_data: