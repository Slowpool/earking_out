services:
  nginx:
    image: nginx:1.31.7
    volumes:
      - './nginx/etc/nginx/ssl:/etc/nginx/ssl:ro'
    ports:
      - '80:80'
      - '443:443'
      - '1937:5005'

  earking-out-java:
    container_name:
      'earking-out-java'
    build:
      dockerfile: './java/Dockerfile.prod'
    volumes:
    # TODO mount static files, templates, resources.
    # TODO remove these lines
      - '${PROJECT_ROOT}/target/classes:/app/BOOT-INF/classes:delegated'
      - '${PROJECT_ROOT}/target/lib:/app/BOOT-INF/lib:delegated'
    environment:
      SPRING_APPLICATION_NAME: "${APP_NAME}"
      SPRING_DATASOURCE_URL: "${POSTGRES_CONNECTION_URI}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      # SPRING_DATA_REDIS_HOST: "${SPRING_DATA_REDIS_HOST}"
      # SPRING_DATA_REDIS_PORT: "${SPRING_DATA_REDIS_PORT}"
      # SPRING_DATA_REDIS_PASSWORD: "${SPRING_DATA_REDIS_PASSWORD}"
    depends_on:
      - postgres

  postgres:
    image: 'postgres:18.6'
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - 'pg_db:/var/lib/postgresql'

volumes:
  pg_db:
  # redis_data: